version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      - dependency-name: "com.networknt:json-schema-validator"
        versions: [">=2.0.0"]
      # zstd-jni 1.5.7-18 added a Java 22 FFM binding (META-INF/versions/22, linkToNative) that
      # GraalVM native-image cannot compile; stay below it until the native build supports it.
      - dependency-name: "com.github.luben:zstd-jni"
        versions: [">=1.5.7-18"]
    labels:
      - "dependencies"
      - "java"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
