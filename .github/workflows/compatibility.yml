name: Compatibility Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'docker/Dockerfile.native-package'
      - 'docker/entrypoint.sh'
      - 'compatibility-tests/**'
      - '.github/workflows/compatibility.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: Build native floci-oci image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          # no `cache: maven` - it keys on setup-graalvm-Linux-maven-<hash>, a key only
          # this pull_request-only workflow ever writes. Actions caches are ref-scoped, so
          # those writes land in refs/pull/N/merge and no run can read another's: it misses
          # every time while still saving hundreds of MB nothing will read.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Restore-only, keyed identically to ci.yml so this reads the ~/.m2 that ci.yml saves
      # on push to main. ci.yml stays the single writer; a second writer would race it.
      # Partial-hit caveat: ci.yml runs x64 and this runs arm64, but `runner.os` is Linux
      # for both and Maven artifacts are arch-neutral, so only classifier-based natives
      # re-download. `-Dnative` also pulls native-image plugins `mvn test` never fetches.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Build native executable (quick build)
        run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-Ob"

      - name: Stage native binary for packaging
        run: |
          mkdir -p native/arm64
          cp target/*-runner native/arm64/application
          cp target/*.so native/arm64/ 2>/dev/null || true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build native Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.native-package
          tags: floci-oci:test-native
          outputs: type=docker,dest=/tmp/floci-oci-native-image.tar
          # No layer cache here, deliberately. The COPY below brings in a natively
          # compiled binary that changes every commit, and Docker layer reuse is
          # sequential, so nothing after it can ever be reused: the cache was write-only.
          # `mode=max` still stored the whole image, including that volatile
          # multi-hundred-MB binary layer, once per PR ref.

      - name: Compress native image
        run: gzip /tmp/floci-oci-native-image.tar

      - name: Upload native floci-oci image
        uses: actions/upload-artifact@v7
        with:
          name: floci-oci-native-image
          path: /tmp/floci-oci-native-image.tar.gz
          retention-days: 1

  native-compat-test:
    name: native / ${{ matrix.test }}
    needs: build-native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - sdk-test-java
          - sdk-test-python
          - sdk-test-cli
          - compat-terraform
          - compat-opentofu

    steps:
      - name: Download native floci-oci image
        uses: actions/download-artifact@v8
        with:
          name: floci-oci-native-image
          path: /tmp

      - name: Load native floci-oci image
        run: gunzip -c /tmp/floci-oci-native-image.tar.gz | docker load

      - name: Create Docker network
        run: docker network create compat-net

      - name: Start floci-oci
        run: |
          DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          docker run -d --name floci-oci --network compat-net \
            -p 4599:4599 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add "$DOCKER_GID" \
            -e FLOCI_OCI_BASE_URL=http://floci-oci:4599 \
            -e FLOCI_OCI_SERVICES_DOCKER_NETWORK=compat-net \
            -e FLOCI_OCI_HOSTNAME=floci-oci \
            floci-oci:test-native

      - name: Wait for floci-oci to be ready
        run: timeout 60 bash -c 'until curl -sf http://localhost:4599/health >/dev/null 2>&1; do sleep 1; done'

      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: compatibility-tests

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: compatibility-tests/${{ matrix.test }}
          load: true
          tags: compat-${{ matrix.test }}
          # Read-only on purpose. Actions caches are ref-scoped, so a pull_request run's
          # writes land in refs/pull/N/merge, private to that PR: one copy per open PR
          # overran the repo's cache budget and evicted entries between a PR's own runs.
          # warm-compat-caches.yml populates these scopes on main; PRs read that one copy.
          cache-from: type=gha,scope=${{ matrix.test }}

      - name: Run tests
        id: tests
        run: |
          mkdir -p test-results
          docker run --rm --network compat-net \
            -e FLOCI_OCI_ENDPOINT=http://floci-oci:4599 \
            -v "$(pwd)/test-results:/results" \
            compat-${{ matrix.test }}

      - name: Generate test summary
        if: always() && steps.tests.outcome != 'skipped'
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
        with:
          paths: test-results/*.xml

      - name: Dump floci-oci logs
        if: failure()
        run: docker logs floci-oci
